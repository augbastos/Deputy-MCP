# Deputy MCP — local run via Docker Compose.
# Copy .env.example to .env, fill in one authentication mode, then point your MCP client at:
#   docker compose run --rm -T deputy-mcp
# The server speaks MCP over stdio: stdin must stay open, and no TTY may be attached
# (a TTY rewrites line endings and corrupts the JSON-RPC stream).
services:
  deputy-mcp:
    build: .
    image: deputy-mcp:local
    env_file:
      - .env
    stdin_open: true
    tty: false
