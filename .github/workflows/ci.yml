name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual run, e.g. right after the repository becomes public

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"  # every job installs exactly what uv.lock pins

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows is a first-class target (keychain backend, paths, line endings):
          # cover the oldest and newest supported Python there too.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: pytest (unit, client, server and agent evals; coverage gate on one leg)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.13" ]; then
            uv run pytest --cov --cov-report=term-missing
          else
            uv run pytest
          fi

  package:
    name: Package (build, metadata, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Build sdist and wheel
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/deputy-mcp --help
          /tmp/wheel-check/bin/python -c "import deputy_mcp, deputy_mcp.server.app; print(deputy_mcp.__version__)"
      - name: CycloneDX SBOM of the locked runtime dependencies
        run: uv export --preview-features sbom-export --format cyclonedx1.5 --no-dev --output-file dist/deputy-mcp.cdx.json > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Audit every locked package (runtime and dev) against the PyPA advisory DB
        run: |
          uv export --no-emit-project --format requirements.txt --output-file /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --require-hashes --disable-pip --strict

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: docker build
        run: docker build --tag deputy-mcp:ci .
      - name: The image starts and fails closed without credentials
        run: |
          set +e
          output=$(docker run --rm deputy-mcp:ci 2>&1 </dev/null)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "No Deputy credentials found"
