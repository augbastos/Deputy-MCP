# Keeps the lockfile, the pinned action SHAs and the container base image current.
# Updates are grouped so a routine week is one pull request per ecosystem, each of which
# must pass the same CI, audit and security checks as any other change.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
